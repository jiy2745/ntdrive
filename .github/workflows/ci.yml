name: CI

# PRD DEV-4: the pre-commit hook set plus the tests, on a clean Windows machine, for every
# push to main and every pull request. Live tests against a real VM stay manual.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install the project and dev tools
        run: uv sync --locked

      - name: Cache pre-commit hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: pre-commit (ruff, mypy, prettier, ASCII check)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: pytest
        run: uv run pytest -q
