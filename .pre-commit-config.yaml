repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.7
          - types-PyYAML
          - types-paramiko
          - types-psutil
        args: [--config-file=pyproject.toml]
        pass_filenames: false

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^src/ntdrive/daemon/static/.*\.(html|css|js)$

  - repo: local
    hooks:
      - id: check-ascii
        name: check-ascii (English only, no decorative symbols)
        entry: python scripts/check_ascii.py
        language: system
        types: [text]
        exclude: ^PRD\.md$
