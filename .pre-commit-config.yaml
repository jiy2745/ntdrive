repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: local
    hooks:
      # ruff and mypy run from the project environment, the versions pinned in uv.lock, so the
      # hook, CI and `uv run ruff` or `uv run mypy` are one and the same tool. A mirror hook would
      # pin a second ruff version, and the mirrors-mypy hook runs without click, aiohttp, mcp and
      # the other runtime packages. `--no-sync` because a sync rewrites ntdrive-mcp.exe, which
      # fails while an MCP client holds it. CI runs `uv sync --locked` before the hooks.
      - id: ruff-check
        name: ruff check (lint, import order, --fix)
        entry: uv run --no-sync ruff check --fix src tests scripts
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format src tests scripts
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy
        name: mypy (project environment)
        entry: uv run --no-sync mypy
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^src/ntdrive/daemon/static/.*\.(html|css|js)$

  - repo: local
    hooks:
      - id: check-ascii
        name: check-ascii (English only, no decorative symbols)
        entry: python scripts/check_ascii.py
        language: system
        types: [text]
