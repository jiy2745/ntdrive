repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix]

  - repo: local
    hooks:
      # The mirrors-mypy hook runs in an isolated environment without click, aiohttp, mcp and
      # the other runtime packages, so it reported untyped decorators everywhere. Running the
      # project's own mypy keeps the hook identical to `uv run mypy`.
      - id: mypy
        name: mypy (project environment)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^src/ntdrive/daemon/static/.*\.(html|css|js)$

  - repo: local
    hooks:
      - id: check-ascii
        name: check-ascii (English only, no decorative symbols)
        entry: python scripts/check_ascii.py
        language: system
        types: [text]
        exclude: ^PRD\.md$
